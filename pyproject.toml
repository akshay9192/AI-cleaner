[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-cleaner"
version = "0.1.0"
description = "Human-reviewed, recoverable cleanup for Windows project folders"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Akshay Harwalkar" }]
dependencies = [
  "PySide6>=6.8,<6.12",
]

[project.scripts]
ai-cleaner = "ai_cleaner.cli:main"
ai-cleaner-gui = "ai_cleaner.ui.app:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pyinstaller>=6.11",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-qt>=4.4",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cleaner"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "windows: requires native Windows filesystem semantics",
  "ui: exercises the Qt interface",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["_bmad", "_bmad-output", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_cleaner"]
mypy_path = "src"
exclude = ["build", "dist"]
